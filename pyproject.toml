[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "scikit-learn>=1.3,<2", "cvxpy>=1.4,<2", "matplotlib>=3.8,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "yfinance>=0.2.50,<1", "arch>=7,<9", "statsmodels>=0.14,<1", "pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["quant_risk_engine*"]
